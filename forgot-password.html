<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | ES Battle</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="login.css"
    >
</head>

<body class="bg-gradient-to-br from-[#050810] via-[#0a1428] to-[#0f2747] min-h-screen flex items-center justify-center p-4">

    <main
        class="login-container w-full max-w-md p-8 bg-white rounded-2xl shadow-2xl border border-gray-100"
    >

        <h1
            class="text-3xl font-bold text-center text-gray-900 mb-8 bg-gradient-to-r from-[#2563eb] to-[#38bdf8] bg-clip-text text-transparent"
        >
            Reset Password
        </h1>

        <form
            id="forgot-password-form"
            class="space-y-5"
            novalidate
        >

            <!-- EMAIL -->
            <div>
                <label
                    for="email"
                    class="block text-sm font-semibold text-gray-900 mb-2"
                >
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="you@example.com"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg bg-gray-50 text-gray-900 text-sm focus:border-[#2563eb] focus:bg-white transition-all duration-300 hover:border-gray-400"
                >
            </div>

            <!-- PHONE -->
            <div>
                <label
                    for="phone"
                    class="block text-sm font-semibold text-gray-900 mb-2"
                >
                    Phone Number:
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    inputmode="tel"
                    autocomplete="tel"
                    placeholder="Enter registered phone number"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg bg-gray-50 text-gray-900 text-sm focus:border-[#2563eb] focus:bg-white transition-all duration-300 hover:border-gray-400"
                >
            </div>

            <!-- UID -->
            <div>
                <label
                    for="ffUid"
                    class="block text-sm font-semibold text-gray-900 mb-2"
                >
                    Free Fire UID:
                </label>

                <input
                    type="text"
                    id="ffUid"
                    name="ffUid"
                    inputmode="numeric"
                    pattern="[0-9]{6,12}"
                    minlength="6"
                    maxlength="12"
                    autocomplete="off"
                    placeholder="Enter registered Free Fire UID"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg bg-gray-50 text-gray-900 text-sm focus:border-[#2563eb] focus:bg-white transition-all duration-300 hover:border-gray-400"
                >
            </div>

            <p class="text-xs text-gray-500">
                Enter your registered email and either your phone number
                or Free Fire UID to verify your account.
            </p>

            <!-- NEW PASSWORD -->
            <div>
                <label
                    for="newPassword"
                    class="block text-sm font-semibold text-gray-900 mb-2"
                >
                    New Password:
                </label>

                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="At least 6 characters"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg bg-gray-50 text-gray-900 text-sm focus:border-[#2563eb] focus:bg-white transition-all duration-300 hover:border-gray-400"
                >
            </div>

            <!-- CONFIRM PASSWORD -->
            <div>
                <label
                    for="confirmPassword"
                    class="block text-sm font-semibold text-gray-900 mb-2"
                >
                    Confirm Password:
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Enter password again"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg bg-gray-50 text-gray-900 text-sm focus:border-[#2563eb] focus:bg-white transition-all duration-300 hover:border-gray-400"
                >
            </div>

            <!-- MESSAGE -->
            <div
                id="message"
                class="message min-h-6 text-sm font-medium transition-opacity duration-300"
                aria-live="polite"
            ></div>

            <!-- SUBMIT -->
            <button
                type="submit"
                class="w-full px-4 py-3 bg-gradient-to-r from-[#2563eb] to-[#1e40af] text-white font-semibold rounded-lg shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300 relative overflow-hidden mt-6"
            >
                Update Password
            </button>

            <!-- BACK -->
            <p class="text-center text-gray-700 text-sm">

                <a
                    class="register-link text-[#2563eb] font-semibold hover:text-[#38bdf8] hover:underline transition-colors duration-300"
                    href="login.html"
                >
                    Back to Login
                </a>

            </p>

        </form>
    </main>

    <script
        type="module"
        src="login.js"
    ></script>

</body>
</html>
