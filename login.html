<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body class="bg-gradient-to-br from-[#050810] via-[#0a1428] to-[#0f2747] min-h-screen flex items-center justify-center p-4">
    <div class="login-container w-full max-w-md p-8 bg-white rounded-2xl shadow-2xl border border-gray-100">
        <h1 class="text-3xl font-bold text-center text-gray-900 mb-8 bg-gradient-to-r from-[#2563eb] to-[#38bdf8] bg-clip-text text-transparent">Login</h1>
        <form id="login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-900 mb-2">Email:</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg bg-gray-50 text-gray-900 text-sm focus:border-[#2563eb] focus:bg-white transition-all duration-300 hover:border-gray-400">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-900 mb-2">Password:</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg bg-gray-50 text-gray-900 text-sm focus:border-[#2563eb] focus:bg-white transition-all duration-300 hover:border-gray-400">
            </div>

            <div class="flex items-center justify-between">
                <label for="remember-me" class="flex items-center gap-2 text-sm text-gray-700 font-medium cursor-pointer select-none">
                    <input type="checkbox" id="remember-me" name="rememberMe" class="w-4 h-4 rounded border-2 border-gray-300 text-[#2563eb] focus:ring-blue-500 cursor-pointer">
                    Remember me
                </label>
            </div>

            <div id="message" class="message min-h-6 text-sm font-medium transition-opacity duration-300" aria-live="polite"></div>

            <button type="submit" class="w-full px-4 py-3 bg-gradient-to-r from-[#2563eb] to-[#1e40af] text-white font-semibold rounded-lg shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300 relative overflow-hidden mt-6">Login</button>

            <p class="text-center text-gray-700 text-sm mt-4"><a href="forgot-password.html" class="forgot-password-link text-[#2563eb] font-semibold hover:text-[#38bdf8] hover:underline transition-colors duration-300">Forgot Password?</a></p>
            <p class="text-center text-gray-700 text-sm">Don't have an account? <a class="register-link text-[#2563eb] font-semibold hover:text-[#38bdf8] hover:underline transition-colors duration-300" href="register.html">Register here</a></p>
        </form>
    </div>
    <div id="message" class="message"></div>

    <script type="module" src="login.js"></script>
</body>
</html>
